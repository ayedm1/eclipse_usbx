name: USBX Regression Sample RTOS

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'CMake build configuration to use'
        required: false
        default: 'default_build_coverage'
      test_name:
        description: 'Executable test target to run'
        required: false
        default: 'usbx_hid_mouse_demo_device_rtos_test'
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run_sample_rtos_test:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: ${{ inputs.build_configuration || 'default_build_coverage' }}
      TEST_NAME: ${{ inputs.test_name || 'usbx_hid_mouse_demo_device_rtos_test' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install required packages
        run: ./scripts/install.sh

      - name: Configure CMake
        run: >-
          cmake -S test/cmake/usbx -B test/cmake/usbx/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }}
          -DTHREADX_ARCH=linux
          -DTHREADX_TOOLCHAIN=gnu

      - name: Build sample RTOS test
        run: cmake --build test/cmake/usbx/build --target ${{ env.TEST_NAME }} -- -j 2

      - name: Run sample RTOS test
        run: |
          cd test/cmake/usbx/build
          ctest -R ${{ env.TEST_NAME }} --output-on-failure
